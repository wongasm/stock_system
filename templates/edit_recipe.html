{% extends "navbar.html" %}

{% block content %}
<div class="container-fluid p-0 mt-5 pt-4">
    <div class="d-flex justify-content-between align-items-center mb-4 px-3">
        <div>
            <h2 class="fw-bold app-title">Edit Recipe</h2>
            <div class="small-text">Update output item and ingredients.</div>
        </div>
        <a href="{{ url_for('manage_recipes') }}" class="btn app-btn-secondary app-btn">Back</a>
    </div>

    <div class="card app-card mx-3 mb-5 p-4">
        <form method="POST" class="row g-3">
            <div class="col-md-6">
                <label class="form-label small-text fw-semibold">Output Item</label>
                <select name="output_item" class="form-select">
                    {% for ing in ingredients %}
                    <option value="{{ ing.id }}" {% if recipe.output_item_id == ing.id %}selected{% endif %}>{{ ing.name }}</option>
                    {% endfor %}
                </select>
            </div>

            <div class="col-12">
                <h5 class="fw-bold mb-2">Ingredients</h5>
                <div id="ingredients-list">
                    {% for ri in recipe_ingredients %}
                    <div class="input-group mb-2">
                        <select name="ingredient_id" class="form-select">
                            {% for ing in ingredients %}
                            <option value="{{ ing.id }}" {% if ri.ingredient_id == ing.id %}selected{% endif %}>{{ ing.name }}</option>
                            {% endfor %}
                        </select>
                        <input type="number" name="grams_used" class="form-control" value="{{ ri.grams_used }}" required>
                    </div>
                    {% endfor %}
                </div>
            </div>

            <div class="col-12 d-flex gap-2">
                <button type="submit" class="btn app-btn-primary app-btn">Update Recipe</button>
                <a href="{{ url_for('manage_recipes') }}" class="btn app-btn-secondary app-btn">Cancel</a>
            </div>
        </form>
    </div>
</div>
{% endblock %}
