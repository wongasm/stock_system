{% extends "navbar.html" %}

{% block content %}
<div class="container-fluid p-0 mt-5 pt-4">
    <div class="d-flex flex-wrap justify-content-between align-items-center gap-2 mb-4 px-3">
        <div>
            <h2 class="fw-bold app-title">Daily Stocktake Order</h2>
            <div class="small-text">Drag and drop ingredients to set the daily stocktake order.</div>
        </div>
        <span class="badge-soft">{{ ingredients|length }} items</span>
    </div>

    <div class="card app-card mx-3 mb-3 p-3">
        <input type="text" id="stocktakeSearch" class="form-control search-input" placeholder="Search ingredients...">
    </div>

    <div class="card app-card mx-3 mb-5 p-3">
        <ul id="stocktakeList" class="list-group list-group-flush">
            {% for ingredient in ingredients %}
                <li class="list-group-item d-flex justify-content-between align-items-center" data-id="{{ ingredient.id }}">
                    <span class="fw-semibold">{{ ingredient.name }}</span>
                    <span class="drag-handle">≡</span>
                </li>
            {% endfor %}
        </ul>

        <button id="saveOrder" class="btn app-btn-primary app-btn mt-3">Save Order</button>
    </div>
</div>

<!-- ✅ JavaScript for Drag-and-Drop -->
<script>
    document.addEventListener("DOMContentLoaded", function () {
        const list = document.getElementById("stocktakeList");
        const saveButton = document.getElementById("saveOrder");
        const searchInput = document.getElementById("stocktakeSearch");

        new Sortable(list, {
            animation: 150,
            handle: ".drag-handle",
            onEnd: function () {
                saveButton.disabled = false;
            }
        });

        saveButton.addEventListener("click", function () {
            let order = [];
            document.querySelectorAll("#stocktakeList li").forEach((item, index) => {
                order.push(item.getAttribute("data-id"));
            });

            fetch("{{ url_for('update_stocktake_order') }}", {
                method: "POST",
                headers: {
                    "Content-Type": "application/json"
                },
                body: JSON.stringify({ order: order })
            })
            .then(response => response.json())
            .then(data => {
                if (data.success) {
                    alert("Stocktake order updated successfully!");
                    location.reload();
                } else {
                    alert("Failed to update order.");
                }
            });
        });

        if (searchInput) {
            searchInput.addEventListener("input", () => {
                const query = searchInput.value.trim().toLowerCase();
                document.querySelectorAll("#stocktakeList li").forEach(item => {
                    const name = item.textContent.trim().toLowerCase();
                    item.style.display = name.includes(query) ? "flex" : "none";
                });
            });
        }
    });
</script>

<!-- ✅ Include SortableJS Library -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/Sortable/1.14.0/Sortable.min.js"></script>
{% endblock %}
