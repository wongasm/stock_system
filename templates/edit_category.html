{% extends "navbar.html" %}

{% block content %}
<div class="container-fluid p-0 mt-5 pt-4">
    <div class="d-flex justify-content-between align-items-center mb-4 px-3">
        <div>
            <h2 class="fw-bold app-title">Edit Category</h2>
            <div class="small-text">Update category details.</div>
        </div>
        <a href="{{ url_for('manage_categories') }}" class="btn app-btn-secondary app-btn">Back</a>
    </div>

    <div class="card app-card mx-3 mb-5 p-4">
        <form action="{{ url_for('edit_category', id=category.id) }}" method="post" class="row g-3">
            <div class="col-md-8">
                <label class="form-label small-text fw-semibold">Category Name</label>
                <input type="text" name="name" class="form-control" value="{{ category.name }}" required>
            </div>
            <div class="col-md-4 d-flex align-items-end">
                <button type="submit" class="btn app-btn-primary app-btn w-100">Save Changes</button>
            </div>
            <div class="col-12">
                <a href="{{ url_for('manage_categories') }}" class="btn app-btn-secondary app-btn">Cancel</a>
            </div>
        </form>
    </div>
</div>
{% endblock %}
