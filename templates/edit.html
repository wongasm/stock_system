{% extends "navbar.html" %}

{% block content %}
<div class="container-fluid p-0 mt-5 pt-4">
    <div class="d-flex justify-content-between align-items-center mb-4 px-3">
        <div>
            <h2 class="fw-bold app-title">Edit Ingredient</h2>
            <div class="small-text">Update ingredient details and stocktake settings.</div>
        </div>
        <a href="{{ url_for('index') }}" class="btn app-btn-secondary app-btn">Back to List</a>
    </div>

    <div class="card app-card mx-3 mb-5 p-4">
        <form action="{{ url_for('update_ingredient', id=ingredient.id) }}" method="post" class="row g-3">
            <div class="col-md-6">
                <label class="form-label small-text fw-semibold">Name</label>
                <input type="text" name="name" class="form-control" value="{{ ingredient.name }}" required>
            </div>
            <div class="col-md-3">
                <label class="form-label small-text fw-semibold">Quantity</label>
                <input type="number" name="quantity" class="form-control" value="{{ ingredient.quantity }}" required>
            </div>
            <div class="col-md-3">
                <label class="form-label small-text fw-semibold">Unit</label>
                <input type="text" name="unit" class="form-control" value="{{ ingredient.unit }}" required>
            </div>

            <div class="col-md-6">
                <label class="form-label small-text fw-semibold">Supplier</label>
                <select name="supplier" class="form-select">
                    <option value="">Select Supplier</option>
                    {% for supplier in suppliers %}
                    <option value="{{ supplier.name }}" {% if ingredient.supplier == supplier.name %}selected{% endif %}>
                        {{ supplier.name }}
                    </option>
                    {% endfor %}
                </select>
            </div>
            <div class="col-md-6">
                <label class="form-label small-text fw-semibold">Category</label>
                <select name="category" class="form-select">
                    <option value="">Select Category</option>
                    {% for category in categories %}
                    <option value="{{ category.name }}" {% if ingredient.category == category.name %}selected{% endif %}>
                        {{ category.name }}
                    </option>
                    {% endfor %}
                </select>
            </div>

            <div class="col-md-4">
                <label class="form-label small-text fw-semibold">Grams/Unit</label>
                <input type="number" step="0.01" name="grams_per_unit" class="form-control" value="{{ ingredient.grams_per_unit }}">
            </div>
            <div class="col-md-4">
                <label class="form-label small-text fw-semibold">Threshold</label>
                <input type="number" name="threshold" class="form-control" value="{{ ingredient.threshold }}">
            </div>
            <div class="col-md-4">
                <label class="form-label small-text fw-semibold">Price/Unit</label>
                <input type="number" step="0.01" name="price_per_unit" class="form-control" value="{{ ingredient.price_per_unit }}">
            </div>
            <div class="col-md-4">
                <label class="form-label small-text fw-semibold">Selling Price</label>
                <input type="number" step="0.01" name="selling_price" class="form-control" value="{{ ingredient.selling_price }}">
            </div>
            <div class="col-md-4">
                <label for="daily_stocktake" class="form-label small-text fw-semibold">Daily Stocktake</label>
                <select name="daily_stocktake" class="form-select">
                    <option value="1" {% if ingredient.daily_stocktake %}selected{% endif %}>Yes</option>
                    <option value="0" {% if not ingredient.daily_stocktake %}selected{% endif %}>No</option>
                </select>
            </div>
            <div class="col-md-4">
                <label for="weekly_stocktake" class="form-label small-text fw-semibold">Include in Weekly Stocktake</label>
                <select name="weekly_stocktake" class="form-select">
                    <option value="1" {% if ingredient.weekly_stocktake %}selected{% endif %}>Yes</option>
                    <option value="0" {% if not ingredient.weekly_stocktake %}selected{% endif %}>No</option>
                </select>
            </div>

            <div class="col-12 d-flex gap-2">
                <button type="submit" class="btn app-btn-primary app-btn">Save Changes</button>
                <a href="{{ url_for('index') }}" class="btn app-btn-secondary app-btn">Cancel</a>
            </div>
        </form>
    </div>
</div>
{% endblock %}
