{% extends "navbar.html" %}

{% block content %}
<div class="container mt-4">
    <h2 class="text-center">Manage Suppliers</h2>

    <!-- Add Supplier Form -->
    <form action="{{ url_for('manage_suppliers') }}" method="post" class="mx-auto" style="max-width: 500px;">
        <div class="mb-3">
            <label class="form-label">Supplier Name:</label>
            <input type="text" name="name" class="form-control" required>
        </div>
        <button type="submit" class="btn btn-primary w-100">Add Supplier</button>
    </form>

    <hr>

    <!-- Supplier List -->
    <h4 class="mt-4">Existing Suppliers</h4>
    <table class="table table-bordered">
        <thead class="table-dark">
            <tr>
                <th>ID</th>
                <th>Supplier Name</th>
                <th>Actions</th>
            </tr>
        </thead>
        <tbody>
            {% for supplier in suppliers %}
            <tr>
                <td>{{ supplier.id }}</td>
                <td>{{ supplier.name }}</td>
                <td>
                    <a href="{{ url_for('edit_supplier', id=supplier.id) }}" class="btn btn-warning btn-sm">Edit</a>
                    <a href="{{ url_for('delete_supplier', id=supplier.id) }}" class="btn btn-danger btn-sm" onclick="return confirm('Are you sure you want to delete this supplier?')">Delete</a>
                </td>
            </tr>
            {% endfor %}
        </tbody>
    </table>
</div>
{% endblock %}
