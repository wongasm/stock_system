{% extends "navbar.html" %}

{% block content %}
<div class="container">
    <h2>Manage Weekly Stocktake Order</h2>

    <p>Drag and drop the ingredients to set their display order for weekly stocktake.</p>

    <ul id="weeklyStocktakeList" class="list-group">
        {% for ingredient in ingredients %}
            <li class="list-group-item d-flex justify-content-between align-items-center" data-id="{{ ingredient.id }}">
                {{ ingredient.name }}
                <span class="drag-handle">&#x2630;</span>
            </li>
        {% endfor %}
    </ul>

    <button id="saveWeeklyOrder" class="btn btn-success mt-3">Save Order</button>
</div>

<!-- ✅ JavaScript for Drag-and-Drop -->
<script>
    document.addEventListener("DOMContentLoaded", function () {
        const list = document.getElementById("weeklyStocktakeList");
        const saveButton = document.getElementById("saveWeeklyOrder");

        new Sortable(list, {
            animation: 150,
            handle: ".drag-handle",
            onEnd: function () {
                saveButton.disabled = false;
            }
        });

        saveButton.addEventListener("click", function () {
            let order = [];
            document.querySelectorAll("#weeklyStocktakeList li").forEach((item, index) => {
                order.push(item.getAttribute("data-id"));
            });

            fetch("{{ url_for('update_weekly_stocktake_order') }}", {
                method: "POST",
                headers: {
                    "Content-Type": "application/json"
                },
                body: JSON.stringify({ order: order })
            })
            .then(response => response.json())
            .then(data => {
                if (data.success) {
                    alert("Weekly Stocktake order updated successfully!");
                    location.reload();
                } else {
                    alert("Failed to update order.");
                }
            });
        });
    });
</script>

<!-- ✅ Include SortableJS Library -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/Sortable/1.14.0/Sortable.min.js"></script>
{% endblock %}
