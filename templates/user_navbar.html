<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>Stock System - User</title>

    <!-- Favicon -->
    <link rel="icon" type="image/png" href="{{ url_for('static', filename='favicon.png') }}">

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Work+Sans:wght@400;500;600&display=swap" rel="stylesheet">

    <!-- Global App Styles -->
    <link href="{{ url_for('static', filename='app.css') }}" rel="stylesheet">

    <style>
        /* ----------------------------------------------
           SIDEBAR BASE
        ---------------------------------------------- */
        #sidebar {
            position: fixed;
            top: 0;
            left: 0;
            bottom: 0;
            width: 270px;
            background: linear-gradient(180deg, rgba(10, 15, 28, 0.98), rgba(15, 23, 42, 0.98));
            color: var(--nav-text);
            padding: 18px 16px 20px;
            overflow-y: auto;
            transition: transform 0.25s ease;
            box-shadow: var(--shadow-lg);
            z-index: 1050;
        }

        #sidebar.hidden {
            transform: translateX(-270px);
        }

        #sidebar::-webkit-scrollbar { width: 6px; }
        #sidebar::-webkit-scrollbar-thumb {
            background: rgba(148, 163, 184, 0.35);
            border-radius: 4px;
        }

        /* ----------------------------------------------
           NAV LINKS
        ---------------------------------------------- */
        .nav-link-custom {
            display: block;
            padding: 10px 14px;
            color: var(--nav-text);
            font-size: 0.95rem;
            font-weight: 500;
            text-decoration: none;
            transition: 0.2s ease;
            border-radius: 10px;
            border: 1px solid transparent;
            margin: 0 8px 8px;
        }

        .nav-link-custom:hover {
            background: rgba(148, 163, 184, 0.14);
            border-color: rgba(148, 163, 184, 0.25);
            color: white;
            transform: translateX(2px);
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 6px 8px 16px;
            border-bottom: 1px solid var(--nav-border);
            margin-bottom: 14px;
        }

        .brand-mark {
            width: 36px;
            height: 36px;
            border-radius: 12px;
            background: linear-gradient(135deg, var(--nav-accent), #22d3ee);
            color: #0b1220;
            display: grid;
            place-items: center;
            font-weight: 700;
            font-family: "Space Grotesk", sans-serif;
        }

        .brand-title {
            font-family: "Space Grotesk", sans-serif;
            font-weight: 600;
            font-size: 0.95rem;
            letter-spacing: 0.2px;
        }

        .brand-subtitle {
            font-size: 0.75rem;
            color: var(--nav-muted);
        }

        .nav-group {
            border: 1px solid var(--nav-border);
            border-radius: 14px;
            margin: 10px 2px;
            background: rgba(15, 23, 42, 0.65);
            padding: 6px 0 2px;
        }

        .nav-group summary {
            list-style: none;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 10px 16px 6px;
            cursor: pointer;
            font-size: 0.8rem;
            text-transform: uppercase;
            letter-spacing: 1.1px;
            color: var(--nav-muted);
            font-weight: 600;
        }

        .nav-group summary::-webkit-details-marker {
            display: none;
        }

        .nav-group summary::after {
            content: "▾";
            font-size: 0.9rem;
            color: var(--nav-muted);
            transition: transform 0.2s ease;
        }

        .nav-group[open] summary::after {
            transform: rotate(180deg);
        }

        /* ----------------------------------------------
           CONTENT AREA
        ---------------------------------------------- */
        #content {
            margin-left: 270px;
            padding: 24px;
            transition: margin-left 0.25s ease;
        }

        #content.expanded {
            margin-left: 0;
        }

        /* ----------------------------------------------
           MOBILE RESPONSIVE
        ---------------------------------------------- */
        @media (max-width: 900px) {
            #sidebar {
                transform: translateX(-270px);
            }

            #sidebar.open {
                transform: translateX(0);
            }

            #content {
                margin-left: 0 !important;
            }
        }

        /* ----------------------------------------------
           TOGGLE BUTTON
        ---------------------------------------------- */
        #toggleSidebar {
            position: fixed;
            top: 15px;
            left: 15px;
            background: #111827;
            color: var(--nav-text);
            border: none;
            padding: 8px 14px;
            border-radius: 10px;
            cursor: pointer;
            z-index: 2000;
            font-weight: 600;
            box-shadow: 0 8px 20px rgba(15, 23, 42, 0.25);
        }
    </style>
</head>

<body>

<!-- Toggle Button -->
<button id="toggleSidebar">Menu</button>

<!-- Sidebar -->
<nav id="sidebar">
    <div class="brand">
        <div class="brand-mark">BC</div>
        <div>
            <div class="brand-title">Bing Chillin</div>
            <div class="brand-subtitle">Store Panel</div>
        </div>
    </div>

    <details class="nav-group" open>
        <summary>Stocktake</summary>
        <a class="nav-link-custom" href="{{ url_for('blank_page') }}">Home</a>
        <a class="nav-link-custom" href="{{ url_for('stocktake', stocktake_type='daily') }}">Daily Stocktake</a>
        <a class="nav-link-custom" href="{{ url_for('stocktake', stocktake_type='weekly') }}">Weekly Stocktake</a>
    </details>

    <details class="nav-group">
        <summary>Inventory</summary>
        <a class="nav-link-custom" href="{{ url_for('stock_in') }}">Stock In / Current Stock</a>
    </details>

    <details class="nav-group">
        <summary>History</summary>
        <a class="nav-link-custom" href="{{ url_for('past_daily_stocktakes') }}">Past Daily Stocktakes</a>
        <a class="nav-link-custom" href="{{ url_for('past_weekly_stocktakes') }}">Past Weekly Stocktakes</a>
    </details>

    <details class="nav-group">
        <summary>Account</summary>
        <a class="nav-link-custom" href="{{ url_for('logout') }}">Logout</a>
    </details>
</nav>

<!-- Page Content -->
<div id="content">
    {% block content %}{% endblock %}
</div>

<script>
    const sidebar = document.getElementById("sidebar");
    const content = document.getElementById("content");
    const toggleBtn = document.getElementById("toggleSidebar");

    function applyLayout() {
        if (window.innerWidth > 900) {
            sidebar.classList.remove("open");
            sidebar.classList.remove("hidden");
            content.classList.remove("expanded");
        } else {
            sidebar.classList.add("hidden");
            content.classList.add("expanded");
        }
    }

    applyLayout();

    toggleBtn.addEventListener("click", () => {
        if (window.innerWidth > 900) {
            sidebar.classList.toggle("hidden");
            content.classList.toggle("expanded");
        } else {
            sidebar.classList.toggle("open");
            if (sidebar.classList.contains("open")) {
                sidebar.classList.remove("hidden");
            }
        }
    });

    window.addEventListener("resize", applyLayout);

    // Highlight the current page in the sidebar
    (function () {
        const here = window.location.pathname.replace(/\/+$/, "");
        document.querySelectorAll("#sidebar .nav-link-custom").forEach(link => {
            const target = link.getAttribute("href").replace(/\/+$/, "");
            if (target && target === here) {
                link.classList.add("active");
                const group = link.closest("details.nav-group");
                if (group) group.open = true;
            }
        });
    })();
</script>

</body>
</html>
