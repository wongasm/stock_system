<!-- ✅ jQuery + Select2 (Fixes: '$ is not defined') -->
<script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>

<link href="https://cdn.jsdelivr.net/npm/select2@4.1.0-rc.0/dist/css/select2.min.css" rel="stylesheet" />
<script src="https://cdn.jsdelivr.net/npm/select2@4.1.0-rc.0/dist/js/select2.min.js"></script>


<div class="container-fluid p-0 mt-5 pt-4">

    <!-- Page Title -->
    <div class="d-flex justify-content-between align-items-center mb-4 px-3">
        <h2 class="fw-bold app-title">Stock In</h2>
    </div>

    <!-- Supplier Filter -->
    <div class="card app-card mb-4 mx-3 p-3">
        <form method="get" action="{{ url_for('stock_in') }}" class="row g-3 align-items-end">

            <div class="col-md-6 col-12">
                <label class="form-label small-text fw-semibold">Filter by Supplier</label>
                <select id="supplier" name="supplier" class="form-select">
                    <option value="">All Suppliers</option>
                    {% for supplier in suppliers %}
                    <option value="{{ supplier.name }}" {% if supplier_filter == supplier.name %}selected{% endif %}>
                        {{ supplier.name }}
                    </option>
                    {% endfor %}
                </select>
            </div>

        </form>
    </div>

    <!-- Stock In Form -->
    <div class="card app-card mx-3 mb-4 p-4">
        <h5 class="fw-bold mb-3">Add Stock</h5>

        <form id="stockInForm">
            <div class="row g-3">

                <!-- Ingredient -->
                <div class="col-md-6 col-12">
                    <label class="form-label small-text fw-semibold">Ingredient</label>
                    <select id="ingredient_id" name="ingredient_id" class="form-select select2" required>
                        <option value="">Search or Select Ingredient</option>
                        {% for ingredient in ingredients|sort(attribute='name') %}
                        <option value="{{ ingredient.id }}">{{ ingredient.name }}</option>
                        {% endfor %}
                    </select>
                </div>

                <!-- Quantity -->
                <div class="col-md-6 col-12">
                    <label class="form-label small-text fw-semibold">Quantity to Add</label>
                    <input type="number" id="stock_added" name="stock_added"
                           class="form-control" placeholder="Enter quantity" required>
                </div>

            </div>

            <button type="submit" class="btn app-btn-primary w-100 mt-3 app-btn">
                + Add Stock
            </button>
        </form>

        <div id="stockMessage" class="alert d-none mt-3"></div>
    </div>

    <!-- Stock Table -->
    <div class="card app-card mx-3 mb-5 p-3">
        <div class="d-flex flex-wrap justify-content-between align-items-center gap-2 mb-3">
            <h5 class="fw-bold mb-0">Current Stock</h5>
            <input type="text" id="stockTableSearch" class="form-control search-input"
                   placeholder="Search stock list..." style="max-width: 240px;">
        </div>

        <div class="table-responsive app-table-container">
            <table class="table table-hover app-table mb-0">
                <thead class="app-thead">
                    <tr>
                        <th>ID</th>
                        <th>Name</th>
                        <th>Quantity</th>
                        <th>Unit</th>
                        <th>Supplier</th>
                    </tr>
                </thead>

                <tbody>
                    {% for ingredient in ingredients %}
                    <tr id="ingredient-{{ ingredient.id }}" class="app-row">
                        <td>{{ ingredient.id }}</td>
                        <td class="fw-semibold">{{ ingredient.name }}</td>
                        <td class="stock-quantity">{{ "%.1f"|format(ingredient.quantity) }}</td>
                        <td>{{ ingredient.unit }}</td>
                        <td>{{ ingredient.supplier }}</td>
                    </tr>
                    {% endfor %}
                </tbody>
            </table>
        </div>

    </div>

</div>

<!-- JS -->
<script>
$(document).ready(function () {

    // Enable Select2 search
    $('#ingredient_id').select2({
        placeholder: "Search Ingredient",
        allowClear: true,
        width: '100%',
    });

    // Auto-submit supplier filter
    $('#supplier').on('change', function () {
        this.form.submit();
    });

    // AJAX for adding stock
    $('#stockInForm').on('submit', function (event) {
        event.preventDefault();

        const formData = new FormData(this);

        fetch("{{ url_for('stock_in') }}", {
            method: "POST",
            body: formData
        })
        .then(res => res.json())
        .then(data => {
            const box = $("#stockMessage");

            if (data.success) {
                const id = $("#ingredient_id").val();
                const newQty = data.new_quantity;

                $(`#ingredient-${id} .stock-quantity`).text(newQty);

                box.removeClass("d-none alert-danger")
                   .addClass("alert-success")
                   .text("Stock updated successfully!");

                $("#ingredient_id").val(null).trigger("change");
                $("#stock_added").val("");

            } else {
                box.removeClass("d-none alert-success")
                   .addClass("alert-danger")
                   .text("Error: " + (data.error || "Failed to update."));
            }
        });
    });

});

const stockTableSearch = document.getElementById("stockTableSearch");
if (stockTableSearch) {
    stockTableSearch.addEventListener("input", () => {
        const query = stockTableSearch.value.trim().toLowerCase();
        document.querySelectorAll("tbody tr.app-row").forEach(row => {
            const nameCell = row.querySelector("td:nth-child(2)");
            const name = nameCell ? nameCell.textContent.trim().toLowerCase() : "";
            row.style.display = name.includes(query) ? "" : "none";
        });
    });
}
</script>
