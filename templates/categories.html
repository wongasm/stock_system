{% extends "navbar.html" %}

{% block content %}
<div class="container mt-4">
    <h2 class="text-center mb-4">Manage Categories</h2>
    <form action="{{ url_for('manage_categories') }}" method="post" class="mb-4">
        <div class="mb-3">
            <label class="form-label">Category Name:</label>
            <input type="text" name="name" class="form-control" placeholder="Enter category name" required>
        </div>
        <button type="submit" class="btn btn-primary w-100">Add Category</button>
    </form>

    <h3>Existing Categories</h3>
    <table class="table table-bordered table-striped">
        <thead class="table-dark">
            <tr>
                <th>ID</th>
                <th>Category Name</th>
                <th>Actions</th>
            </tr>
        </thead>
        <tbody>
            {% for category in categories %}
            <tr>
                <td>{{ category.id }}</td>
                <td>{{ category.name }}</td>
                <td>
                    <a href="{{ url_for('edit_category', id=category.id) }}" class="btn btn-warning btn-sm">Edit</a>
                    <a href="{{ url_for('delete_category', id=category.id) }}" class="btn btn-danger btn-sm" onclick="return confirm('Are you sure you want to delete this category?')">Delete</a>
                </td>
            </tr>
            {% endfor %}
        </tbody>
    </table>
</div>
{% endblock %}
